<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AçoSmart - Oficina de Usinagem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/oficina.css">
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-[#0d0f12] text-slate-300">

  <!-- Header / Barra Superior com Botão de Voltar e Navegação -->
  <header class="bg-[#14171d] border-b border-[#242832] px-4 py-2.5 flex items-center justify-between shadow-md z-20 shrink-0">
    <div class="flex items-center space-x-3">
      <!-- Botão Voltar -->
      <a href="pedidos.html" class="px-2.5 py-1.5 bg-[#1b1e26] hover:bg-[#252934] text-slate-300 rounded border border-[#2a2e39] text-xs font-mono-tech flex items-center gap-1.5">
        <span>← Voltar</span>
      </a>

      <div class="px-2.5 py-1 bg-[#222733] border border-[#373d4d] rounded text-slate-200 font-mono-tech font-bold text-sm tracking-wider">
        <span>⚙️ AÇOSMART</span>
      </div>
      <div class="h-4 w-[1px] bg-[#2a2e39]"></div>
      
      <!-- Navegação Completa -->
      <nav class="flex items-center gap-1 font-mono-tech text-xs">
        <a href="alertas.html" class="px-3 py-1.5 rounded text-slate-400 hover:text-slate-200 hover:bg-[#1b1e26]">Alertas</a>
        <a href="pedidos.html" class="px-3 py-1.5 rounded text-slate-400 hover:text-slate-200 hover:bg-[#1b1e26]">Pedidos</a>
        <a href="materiais.html" class="px-3 py-1.5 rounded text-slate-400 hover:text-slate-200 hover:bg-[#1b1e26]">Materiais</a>
        <a href="maquinas.html" class="px-3 py-1.5 rounded text-slate-400 hover:text-slate-200 hover:bg-[#1b1e26]">Máquinas</a>
        <a href="usuarios.html" class="px-3 py-1.5 rounded text-slate-400 hover:text-slate-200 hover:bg-[#1b1e26]">Usuários</a>
        <a href="fornecedores.html" class="px-3 py-1.5 rounded text-slate-400 hover:text-slate-200 hover:bg-[#1b1e26]">Fornecedores</a>
        <a href="clientes.html" class="px-3 py-1.5 rounded text-slate-400 hover:text-slate-200 hover:bg-[#1b1e26]">Clientes</a>
        <a href="oficina.html" class="px-3 py-1.5 rounded bg-[#222733] text-blue-400 font-bold border border-[#373d4d]">Oficina</a>
      </nav>
    </div>

    <div class="flex items-center gap-3 font-mono-tech text-xs">
      <span id="userDisplay" class="text-slate-400">Operador: Admin</span>
      <a href="login.html" class="px-2.5 py-1 bg-[#1b1e26] hover:bg-[#252934] border border-[#2a2e39] rounded text-slate-300">Sair</a>
    </div>
  </header>

  <!-- Layout Principal em 2 Colunas -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    <aside class="w-full md:w-80 lg:w-96 bg-[#12151b] border-r border-[#222631] p-4 flex flex-col gap-4 z-20 shrink-0 overflow-y-auto">
      <div>
        <label class="font-mono-tech text-xs font-bold text-slate-300 uppercase tracking-wider">1. Liga Metálica</label>
        <div id="material-selector" class="grid grid-cols-2 gap-1.5 mt-2"></div>
      </div>
      <div>
        <label class="font-mono-tech text-xs font-bold text-slate-300 uppercase tracking-wider">2. Produto / Formato</label>
        <div id="object-selector" class="grid grid-cols-2 gap-1.5 mt-2"></div>
      </div>
      <div class="bg-[#181b22] border border-[#262b37] rounded p-3 space-y-2">
        <div class="flex items-center justify-between text-xs font-mono-tech">
          <span class="text-slate-400 font-bold uppercase">Aproveitamento</span>
          <span id="sheet-slot-counter" class="text-slate-200 font-bold">Slot 1 de 6</span>
        </div>
        <div class="w-full bg-[#0d0f12] h-2 rounded overflow-hidden border border-[#2a2e39]">
          <div id="sheet-usage-bar" class="bg-slate-400 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
      <button id="btn-fabricate" class="w-full py-3 bg-[#2b303c] hover:bg-[#373e4f] text-slate-100 font-mono-tech font-bold text-xs rounded border border-[#434b5f] mt-auto">
        🛠️ EXECUTAR USINAGEM E CORTE
      </button>
    </aside>

    <main class="flex-1 relative industrial-grid overflow-hidden">
      <canvas id="factoryCanvas" class="absolute inset-0 w-full h-full z-10 cursor-grab"></canvas>
    </main>
  </div>

  <script src="js/oficina.js"></script>
</body>
</html>
