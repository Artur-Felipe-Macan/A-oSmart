<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AçoSmart - Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo"></div>
      <h1>AÇO<span>SMART</span></h1>
    </div>
    <p class="login-subtitle">Sistema Integrado de Manufatura e Usinagem</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuário / Matrícula</label>
        <input type="text" id="username" placeholder="Digite seu usuário" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">ENTRAR NO SISTEMA</button>
    </form>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
